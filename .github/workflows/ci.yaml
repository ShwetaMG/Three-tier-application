name: CI - Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'Application-Code/**'
      - '.github/workflows/ci.yml'

permissions:           
  contents: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Application-Code/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Application-Code/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}

  update-manifest:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in overlay
        run: |
          yq -i '.images[0].newTag = "${{ github.sha }}"' k8s-manifest/overlays/dev/kustomization.yaml
          yq -i '.images[1].newTag = "${{ github.sha }}"' k8s-manifest/overlays/dev/kustomization.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifest/overlays/dev/kustomization.yaml
          git commit -m "ci: deploy image ${{ github.sha }} [skip ci]"
          git push