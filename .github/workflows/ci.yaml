name: CI - Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'Application-Code/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: write

jobs:
  secret-scan:
    name: Gitleaks - Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    name: SonarQube - Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-backend:
    name: Build, Scan, Push - Backend
    needs: [secret-scan, code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./Application-Code/backend
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          
      - name: Push image (only runs if Trivy passed)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}

  build-frontend:
    name: Build, Scan, Push - Frontend
    needs: [secret-scan, code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./Application-Code/frontend
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}
          build-args: |
            REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND_URL }}
            
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1 
        
      - name: Push image (only runs if Trivy passed)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}

  update-manifest:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Update image tags in overlay
        run: |
          yq -i '.images[0].newTag = "${{ github.sha }}"' k8s-manifest/overlays/dev/kustomization.yaml
          yq -i '.images[1].newTag = "${{ github.sha }}"' k8s-manifest/overlays/dev/kustomization.yaml
      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifest/overlays/dev/kustomization.yaml
          git commit -m "ci: deploy image ${{ github.sha }} [skip ci]"
          git push